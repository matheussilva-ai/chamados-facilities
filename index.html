<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Chamados — Facilities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #17171a;
      --surface2: #1e1e22;
      --border: #2a2a30;
      --border2: #35353d;
      --text: #e8e8ed;
      --text2: #9090a0;
      --text3: #55556a;
      --accent: #4f8ef7;
      --accent-dim: rgba(79,142,247,0.12);
      --green: #34c97e;
      --green-dim: rgba(52,201,126,0.12);
      --yellow: #f5a623;
      --yellow-dim: rgba(245,166,35,0.12);
      --red: #f05c5c;
      --red-dim: rgba(240,92,92,0.12);
      --purple: #a78bfa;
      --purple-dim: rgba(167,139,250,0.12);
      --radius: 10px;
      --radius-sm: 6px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── LAYOUT ── */
    .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 15px; letter-spacing: -0.3px;
    }
    .logo-icon {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .logo-sub { color: var(--text2); font-weight: 400; font-size: 13px; }
    header .spacer { flex: 1; }
    .last-update {
      color: var(--text3); font-size: 12px; font-family: 'DM Mono', monospace;
      display: flex; align-items: center; gap: 6px;
    }
    .pulse {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative; flex: 1; min-width: 200px; max-width: 380px;
    }
    .search-wrap svg {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--text3); pointer-events: none;
    }
    .search-input {
      width: 100%; height: 36px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
      padding: 0 12px 0 34px;
      outline: none; transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--text3); }
    .search-input:focus { border-color: var(--accent); }

    .filter-group { display: flex; gap: 6px; align-items: center; }
    .filter-label { color: var(--text3); font-size: 12px; font-weight: 500; white-space: nowrap; }

    .btn-filter {
      height: 32px; padding: 0 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .btn-filter:hover { border-color: var(--border2); color: var(--text); }
    .btn-filter.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .toolbar .spacer { flex: 1; }
    .count-badge {
      font-family: 'DM Mono', monospace; font-size: 11px;
      color: var(--text3); white-space: nowrap;
    }

    .btn-refresh {
      height: 32px; width: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .btn-refresh:hover { border-color: var(--border2); color: var(--text); }
    .btn-refresh.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MAIN ── */
    .main { flex: 1; overflow-y: auto; padding: 20px 24px; }

    /* ── STATES ── */
    .state-center {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 300px; gap: 12px;
      color: var(--text3); font-size: 13px; text-align: center;
    }
    .state-center svg { opacity: 0.3; }
    .state-center p { max-width: 260px; line-height: 1.6; }

    /* ── GRID ── */
    .tickets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
    }

    /* ── TICKET CARD ── */
    .ticket-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      animation: fadeIn 0.2s ease both;
    }
    .ticket-card:hover {
      border-color: var(--border2);
      transform: translateY(-1px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 10px; margin-bottom: 10px;
    }
    .ticket-number {
      font-family: 'DM Mono', monospace; font-size: 11px;
      color: var(--text3); flex-shrink: 0;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 500; flex-shrink: 0;
    }
    .status-pill::before {
      content: ''; width: 5px; height: 5px;
      border-radius: 50%; background: currentColor;
    }

    .status-open       { color: var(--accent);  background: var(--accent-dim); }
    .status-inprogress { color: var(--yellow);  background: var(--yellow-dim); }
    .status-resolved   { color: var(--green);   background: var(--green-dim); }
    .status-closed     { color: var(--text3);   background: var(--surface2); }
    .status-onhold     { color: var(--purple);  background: var(--purple-dim); }
    .status-other      { color: var(--text2);   background: var(--surface2); }

    .ticket-subject {
      font-size: 13px; font-weight: 500; color: var(--text);
      line-height: 1.4; margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-meta {
      display: flex; flex-wrap: wrap; gap: 8px 16px;
    }
    .meta-item {
      display: flex; align-items: center; gap: 5px;
      color: var(--text3); font-size: 11px;
    }
    .meta-item svg { flex-shrink: 0; }
    .meta-value { color: var(--text2); }

    .card-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 12px 0;
    }
    .last-reply {
      font-size: 12px; color: var(--text3); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .last-reply strong { color: var(--text2); font-weight: 500; }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; transition: opacity 0.2s;
    }
    .modal-backdrop.open { opacity: 1; }
    .modal {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 14px; width: 100%; max-width: 600px; max-height: 80vh;
      overflow-y: auto;
      transform: translateY(12px); transition: transform 0.2s;
    }
    .modal-backdrop.open .modal { transform: translateY(0); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .modal-header h2 { font-size: 15px; font-weight: 600; }
    .modal-close {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text2); cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.15s;
    }
    .modal-close:hover { background: var(--surface2); color: var(--text); }
    .modal-body { padding: 20px; }
    .detail-row {
      display: flex; gap: 8px; margin-bottom: 12px;
      font-size: 13px;
    }
    .detail-key { color: var(--text3); min-width: 120px; flex-shrink: 0; }
    .detail-val { color: var(--text); }
    .detail-section-title {
      font-size: 11px; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin: 20px 0 10px;
    }
    .detail-description {
      font-size: 13px; color: var(--text2); line-height: 1.6;
      background: var(--surface2); border-radius: var(--radius-sm);
      padding: 12px; border: 1px solid var(--border);
    }
    .modal-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 16px; padding: 8px 14px;
      border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface2); color: var(--accent);
      font-size: 12px; font-weight: 500; text-decoration: none;
      transition: all 0.15s;
    }
    .modal-link:hover { border-color: var(--accent); background: var(--accent-dim); }

    /* ── EMPTY SEARCH ── */
    .empty-search {
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 24px; gap: 10px; color: var(--text3);
    }
    .empty-search p { font-size: 13px; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-icon">🎫</div>
      <span>Portal de Chamados</span>
      <span class="logo-sub">/ Facilities</span>
    </div>
    <div class="spacer"></div>
    <div class="last-update" id="lastUpdate">
      <div class="pulse"></div>
      <span>—</span>
    </div>
  </header>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Buscar por assunto..." />
    </div>

    <div class="filter-group">
      <span class="filter-label">Status</span>
      <button class="btn-filter active" data-status="all">Todos</button>
      <button class="btn-filter" data-status="Open">Aberto</button>
      <button class="btn-filter" data-status="In Progress">Em andamento</button>
      <button class="btn-filter" data-status="On Hold">Aguardando</button>
      <button class="btn-filter" data-status="Resolved">Resolvido</button>
    </div>

    <div class="spacer"></div>
    <span class="count-badge" id="countBadge">—</span>
    <button class="btn-refresh" id="btnRefresh" title="Atualizar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">
    <div class="state-center" id="stateLoading">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <p>Carregando chamados...</p>
    </div>
    <div class="state-center" id="stateError" style="display:none">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <p id="stateErrorMsg">Erro ao carregar chamados.</p>
    </div>
    <div id="ticketsContainer" style="display:none">
      <div class="tickets-grid" id="ticketsGrid"></div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Detalhes do Chamado</h2>
      <button class="modal-close" id="modalClose">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const BASE = '';  // mesmo domínio no Vercel

let allTickets = [];
let activeStatus = 'all';
let searchQuery = '';

// ── STATUS MAP ──
const STATUS_MAP = {
  'Open':        { label: 'Aberto',       cls: 'status-open' },
  'In Progress': { label: 'Em andamento', cls: 'status-inprogress' },
  'On Hold':     { label: 'Aguardando',   cls: 'status-onhold' },
  'Resolved':    { label: 'Resolvido',    cls: 'status-resolved' },
  'Closed':      { label: 'Fechado',      cls: 'status-closed' },
};

function statusInfo(s) {
  return STATUS_MAP[s] || { label: s || '—', cls: 'status-other' };
}

// ── DATE FORMAT ──
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' })
    + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'agora';
  if (m < 60) return `${m}min atrás`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h atrás`;
  const days = Math.floor(h / 24);
  return `${days}d atrás`;
}

// ── FETCH ──
async function loadTickets() {
  showLoading();
  setRefreshing(true);

  try {
    const params = new URLSearchParams({ limit: 100 });
    if (activeStatus !== 'all') params.set('status', activeStatus);

    const res = await fetch(`${BASE}/api/tickets?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    allTickets = data.data || [];
    document.getElementById('lastUpdate').innerHTML =
      `<div class="pulse"></div><span>Atualizado ${timeAgo(new Date().toISOString())}</span>`;

    renderTickets();
  } catch (e) {
    showError(e.message);
  } finally {
    setRefreshing(false);
  }
}

// ── RENDER ──
function renderTickets() {
  const q = searchQuery.toLowerCase().trim();

  let filtered = allTickets;
  if (q) {
    filtered = filtered.filter(t =>
      (t.subject || '').toLowerCase().includes(q) ||
      (t.ticketNumber || '').toLowerCase().includes(q)
    );
  }

  const grid = document.getElementById('ticketsGrid');
  document.getElementById('stateLoading').style.display = 'none';
  document.getElementById('stateError').style.display = 'none';

  if (filtered.length === 0) {
    document.getElementById('ticketsContainer').style.display = 'none';
    showEmpty(q);
    document.getElementById('countBadge').textContent = '0 chamados';
    return;
  }

  document.getElementById('ticketsContainer').style.display = 'block';
  document.getElementById('countBadge').textContent =
    `${filtered.length} chamado${filtered.length !== 1 ? 's' : ''}`;

  grid.innerHTML = filtered.map((t, i) => {
    const st = statusInfo(t.status);
    const assignee = t.assignee ? t.assignee.firstName + ' ' + (t.assignee.lastName || '') : 'Não atribuído';
    const contact = t.contact ? t.contact.firstName + ' ' + (t.contact.lastName || '') : '—';

    return `
    <div class="ticket-card" data-idx="${i}" style="animation-delay:${Math.min(i * 0.03, 0.3)}s">
      <div class="card-top">
        <span class="ticket-number">#${t.ticketNumber || t.id}</span>
        <span class="status-pill ${st.cls}">${st.label}</span>
      </div>
      <div class="ticket-subject">${escHtml(t.subject || '(sem assunto)')}</div>
      <div class="card-meta">
        <div class="meta-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
          <span class="meta-value">${escHtml(contact.trim() || '—')}</span>
        </div>
        <div class="meta-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span class="meta-value">${fmtDate(t.createdTime)}</span>
        </div>
        ${t.assignee ? `<div class="meta-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="meta-value">${escHtml(assignee.trim())}</span>
        </div>` : ''}
        <div class="meta-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
          <span>${timeAgo(t.modifiedTime)}</span>
        </div>
      </div>
      ${t.description ? `<hr class="card-divider"><div class="last-reply">${escHtml(stripHtml(t.description).slice(0, 120))}${t.description.length > 120 ? '…' : ''}</div>` : ''}
    </div>`;
  }).join('');

  // click → modal
  grid.querySelectorAll('.ticket-card').forEach(el => {
    el.addEventListener('click', () => openModal(filtered[+el.dataset.idx]));
  });
}

function showEmpty(q) {
  const main = document.getElementById('main');
  // remove previous empty
  main.querySelectorAll('.empty-search').forEach(e => e.remove());
  const div = document.createElement('div');
  div.className = 'empty-search';
  div.innerHTML = `
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <p>${q ? `Nenhum chamado encontrado para "<strong>${escHtml(q)}</strong>"` : 'Nenhum chamado encontrado.'}</p>`;
  main.appendChild(div);
}

function showLoading() {
  document.getElementById('stateLoading').style.display = 'flex';
  document.getElementById('stateError').style.display = 'none';
  document.getElementById('ticketsContainer').style.display = 'none';
  document.querySelectorAll('.empty-search').forEach(e => e.remove());
}

function showError(msg) {
  document.getElementById('stateLoading').style.display = 'none';
  document.getElementById('stateError').style.display = 'flex';
  document.getElementById('ticketsContainer').style.display = 'none';
  document.getElementById('stateErrorMsg').textContent = `Erro: ${msg}`;
}

function setRefreshing(v) {
  document.getElementById('btnRefresh').classList.toggle('spinning', v);
}

// ── MODAL ──
function openModal(t) {
  const st = statusInfo(t.status);
  const assignee = t.assignee ? t.assignee.firstName + ' ' + (t.assignee.lastName || '') : 'Não atribuído';
  const contact = t.contact ? t.contact.firstName + ' ' + (t.contact.lastName || '') : '—';
  const dept = t.department ? t.department.name : '—';

  document.getElementById('modalTitle').textContent = `#${t.ticketNumber || t.id}`;
  document.getElementById('modalBody').innerHTML = `
    <div class="detail-row">
      <span class="detail-key">Status</span>
      <span class="detail-val"><span class="status-pill ${st.cls}">${st.label}</span></span>
    </div>
    <div class="detail-row">
      <span class="detail-key">Assunto</span>
      <span class="detail-val">${escHtml(t.subject || '—')}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">Solicitante</span>
      <span class="detail-val">${escHtml(contact.trim())}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">Responsável</span>
      <span class="detail-val">${escHtml(assignee.trim())}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">Departamento</span>
      <span class="detail-val">${escHtml(dept)}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">Aberto em</span>
      <span class="detail-val">${fmtDate(t.createdTime)}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">Atualizado</span>
      <span class="detail-val">${fmtDate(t.modifiedTime)}</span>
    </div>
    ${t.dueDate ? `<div class="detail-row">
      <span class="detail-key">Prazo</span>
      <span class="detail-val">${fmtDate(t.dueDate)}</span>
    </div>` : ''}
    ${t.description ? `
      <div class="detail-section-title">Descrição</div>
      <div class="detail-description">${escHtml(stripHtml(t.description))}</div>
    ` : ''}
    <a class="modal-link" href="https://desk.zoho.com/agent/genialcare/facilities/tickets/${t.id}" target="_blank">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Abrir no Zoho Desk
    </a>
  `;

  const backdrop = document.getElementById('modalBackdrop');
  backdrop.style.display = 'flex';
  requestAnimationFrame(() => backdrop.classList.add('open'));
}

function closeModal() {
  const backdrop = document.getElementById('modalBackdrop');
  backdrop.classList.remove('open');
  setTimeout(() => { backdrop.style.display = 'none'; }, 200);
}

// ── UTILS ──
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stripHtml(s) {
  return String(s).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
}

// ── EVENTS ──
document.getElementById('btnRefresh').addEventListener('click', loadTickets);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBackdrop')) closeModal();
});

document.querySelectorAll('.btn-filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeStatus = btn.dataset.status;
    loadTickets();
  });
});

let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => renderTickets(), 250);
});

// ── INIT ──
loadTickets();
</script>
</body>
</html>
